<style>
:root{
  --bg:#f3f6fb; --panel:#fff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e4e9f2; --brand:#1d5fbf; --brand-2:#174d9c; --brand-soft:#e9f1fc; --sky:#38b6e8;
  --teal:#0d9488; --teal-soft:#e6f7f5; --amber:#d97706; --amber-soft:#fef5e6;
  --red:#dc2626; --red-soft:#fdecec; --violet:#7c3aed; --violet-soft:#f2ecfe;
  --side:#0a1e3f; --side-ink:#c3d1ea; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --z-man:#1d5fbf; --z-bk:#0d9488; --z-qn:#7c3aed; --z-li:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.ribbon{position:fixed;top:0;left:0;right:0;z-index:60;background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:6px 12px;letter-spacing:.02em;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* language toggle */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:#fff;flex:none}
.lang button{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--ink-2)}
.lang button.on{background:var(--brand);color:#fff}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;padding-top:30px}
.login-art{background:radial-gradient(1100px 600px at 10% 0%,#1d5fbf 0%,#0a1e3f 62%);color:#fff;padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art:after{content:"";position:absolute;right:-140px;bottom:-140px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(56,182,232,.45),transparent 70%)}
.brand-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.brand-row .lg{width:58px;height:58px;border-radius:16px;background:#fff;display:grid;place-items:center;padding:6px}
.brand-row .lg img{width:100%;height:100%;object-fit:contain}
.brand-row b{display:block;font-size:17px;letter-spacing:-.01em}
.brand-row span{font-size:12px;color:#a9bde0}
.login-art h1{font-size:38px;line-height:1.1;letter-spacing:-.02em;max-width:480px;margin:36px 0 14px}
.login-art p{color:#c3d1ea;max-width:450px;font-size:15px}
.feat{display:grid;gap:11px;margin-top:26px;position:relative;z-index:1}
.feat div{display:flex;gap:10px;align-items:center;color:#e2e8f0}
.feat svg{color:#7dd3fc}
.login-panel{display:grid;place-items:center;padding:40px 24px;background:var(--panel);position:relative}
.login-panel .lang{position:absolute;top:20px;right:20px}
.login-card{width:100%;max-width:380px}
.demo-badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:#92400e;border:1px solid #fcd9a5;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;margin-bottom:18px}
.login-card h2{font-size:26px;letter-spacing:-.02em;margin-bottom:6px}
.login-card .sub{color:var(--ink-2);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{border:1px solid var(--line);background:#fff}
.btn-ghost:hover{background:#f8fafc}
.btn-sm{height:32px;font-size:13px;padding:0 12px}
.btn-block{width:100%;height:46px}
.creds{margin-top:20px;border:1px dashed #cbd5e1;border-radius:12px;padding:14px 16px;background:#f8fafc;font-size:13px;color:var(--ink-2)}
.creds b{color:var(--ink)}
.creds code{background:#fff;border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-family:inherit;font-weight:600;color:var(--ink)}
.err{color:var(--red);font-size:13px;margin:-4px 0 12px;display:none}
.login-foot{margin-top:26px;font-size:12px;color:var(--ink-3)}

/* ---------- App shell ---------- */
#app{display:none;padding-top:30px;min-height:100%}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 30px)}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:30px;height:calc(100vh - 30px);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side .brand-row{padding:2px 6px 14px}
.side .brand-row .lg{width:42px;height:42px;border-radius:12px;padding:4px}
.side .brand-row b{font-size:14px;color:#fff}
.side .brand-row span{font-size:11px}
.nav-h{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6f86ad;padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;cursor:pointer;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:linear-gradient(90deg,rgba(56,182,232,.32),rgba(56,182,232,.08));color:#fff}
.nav .count{margin-left:auto;background:var(--sky);color:#06213f;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.side .bottom{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.side .phone{font-size:12px;color:#8fa6cc;padding:6px 12px 10px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:30px;z-index:20}
.top h1{font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);place-items:center;flex:none}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--ink-3);min-width:220px;background:#fafbfd}
.search input{border:0;outline:0;background:none;width:100%;color:var(--ink)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#38b6e8,#1d5fbf);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.content{padding:24px 28px 48px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:15px}
.card-b{padding:18px}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12px;font-weight:600}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.delta{font-size:12px;font-weight:600}
.up{color:var(--teal)} .down{color:var(--red)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.view{display:none}
.view.on{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}

.chart{width:100%;height:220px}
.chart svg{width:100%;height:100%;stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.src{display:grid;gap:14px}
.src-row .tl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:#eef2f7;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 16px;background:#fafbfd;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click:hover{background:#f8fafc;cursor:pointer}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.who small{display:block;color:var(--ink-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-blue{background:var(--brand-soft);color:var(--brand-2)}
.p-teal{background:var(--teal-soft);color:#0f766e}
.p-amber{background:var(--amber-soft);color:#b45309}
.p-red{background:var(--red-soft);color:#b91c1c}
.p-violet{background:var(--violet-soft);color:#6d28d9}
.p-gray{background:#f1f5f9;color:#475569}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.list-item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.list-item:last-child{border-bottom:0}
.date-chip{width:48px;text-align:center;border-radius:10px;background:var(--brand-soft);color:var(--brand-2);padding:6px 0;flex:none}
.date-chip b{display:block;font-size:17px;line-height:1.1}
.date-chip span{font-size:10px;font-weight:700;text-transform:uppercase}
.ico-box{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#e9eef6;border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:#e9eef6;border-radius:12px;padding:10px;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-weight:700;font-size:13px}
.col-h span{color:var(--ink-3);font-weight:600}
.lead-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.lead-card:hover{border-color:#b9d0f3;box-shadow:0 4px 14px rgba(29,95,191,.08)}
.lead-card b{display:block;margin-bottom:2px}
.lead-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3);gap:6px}

.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:56px repeat(6,minmax(120px,1fr));min-width:820px}
.cal .hd{padding:8px;text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line);background:#fafbfd}
.cal .hd b{display:block;font-size:18px;color:var(--ink)}
.cal .hd.today b{color:var(--brand)}
.cal .hd .zn{display:block;font-size:10px;font-weight:600;margin-top:2px}
.cal .tm{font-size:11px;color:var(--ink-3);text-align:right;padding:4px 8px 0 0;height:56px;border-right:1px solid var(--line)}
.cal .cell{height:56px;border-bottom:1px solid #f0f3f8;border-right:1px solid #f0f3f8;position:relative;cursor:copy}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;font-size:11px;line-height:1.3;overflow:hidden;z-index:2;cursor:pointer;border-left:3px solid;background:#fff}
.ev b{display:block;font-size:12px}
.ev .crew{display:inline-block;margin-top:2px;font-size:10px;font-weight:700;opacity:.8}

.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:540px}
.threads{border-right:1px solid var(--line);overflow-y:auto;max-height:640px}
.thread{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:3px}
.thread:hover{background:#f8fafc}
.thread.on{background:var(--brand-soft)}
.thread .l1{display:flex;justify-content:space-between;gap:8px}
.thread .l1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread .l1 span{font-size:12px;color:var(--ink-3);flex:none}
.thread .subj{font-weight:600;font-size:13px}
.thread .prev{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread.unread .l1 b:before{content:"";display:inline-block;width:7px;height:7px;background:var(--brand);border-radius:50%;margin-right:7px;vertical-align:1px}
.reader{display:flex;flex-direction:column;min-width:0}
.reader-h{padding:18px 22px;border-bottom:1px solid var(--line)}
.reader-h h3{font-size:17px;margin-bottom:6px}
.msgs{padding:18px 22px;display:grid;gap:14px;flex:1;align-content:start}
.msg{border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:640px}
.msg.out{background:#f5f9ff;margin-left:auto;border-color:#d3e2f8}
.msg .mh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:6px;gap:10px}
.msg .mh b{color:var(--ink)}
.compose{border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:flex-end}
.compose textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;height:44px;outline:none;min-width:0}
.back-btn{display:none}

.camp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.camp{padding:18px;display:grid;gap:12px;align-content:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;background:#fafbfd;border-radius:10px;padding:10px}
.stats b{display:block;font-size:17px}
.stats span{font-size:11px;color:var(--ink-3)}

.insight{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.insight:last-child{border-bottom:0}

/* quote calc */
.q-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.q-out{background:linear-gradient(135deg,#0a1e3f,#1d5fbf);color:#fff;border-radius:14px;padding:20px;display:grid;gap:12px}
.q-out .big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.q-out .row{display:flex;justify-content:space-between;font-size:13px;color:#cfe0f7;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:7px}
.q-out .row b{color:#fff}
.sample{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;background:var(--amber-soft);color:#92400e;border-radius:999px;padding:3px 9px}

/* quality */
.chk{display:grid;gap:8px}
.chk div{display:flex;gap:10px;align-items:center;font-size:13px}
.chk .b{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:none}
.chk .b.y{background:var(--teal);color:#fff}
.chk .b.n{border:2px solid #cbd5e1}
.chk .b svg{width:12px;height:12px;stroke-width:3}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.ph span{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
.ph.before{background:linear-gradient(135deg,#8b8f97,#5d6169)}
.ph.after{background:linear-gradient(135deg,#7cc8f0,#1d5fbf)}
.ph.miss{background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 8px,#e2e8f0 8px,#e2e8f0 16px);color:#94a3b8}
.ph svg{width:26px;height:26px;opacity:.85}
.progress{height:6px;border-radius:99px;background:#eef2f7;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:8px}
.progress span{display:block;height:100%;background:var(--teal)}

.policy{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.policy:last-child{border-bottom:0}

/* website */
.site-preview{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.browser-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#f1f5f9;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.browser-bar i{width:10px;height:10px;border-radius:50%;background:#cbd5e1;display:inline-block;flex:none}
.browser-bar .url{margin-left:10px;background:#fff;border-radius:6px;padding:3px 10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-mock{padding:26px;background:linear-gradient(135deg,#0a1e3f,#1d5fbf 70%,#38b6e8);color:#fff;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero-mock h4{font-size:22px;letter-spacing:-.02em;line-height:1.15}
.hero-mock p{opacity:.85;margin:8px 0 14px;font-size:13px}
.hero-mock .btn{background:#fff;color:#0f172a;height:34px;font-size:13px}
.hero-mock img{width:84px;background:#fff;border-radius:18px;padding:6px}
.svc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.svc-tiles div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-weight:600}
.score{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;background:conic-gradient(var(--teal) 0 94%,#e2e8f0 94% 100%);position:relative;flex:none}
.score:before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
.score span{position:relative}
.check-list{display:grid;gap:10px}
.check-list div{display:flex;gap:10px;align-items:flex-start}
.check-list svg{color:var(--teal);margin-top:1px}

/* drawer / modal / toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:70;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:#fff;z-index:71;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.drawer.show{transform:none}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-b{padding:18px 22px;overflow-y:auto;display:grid;gap:18px;align-content:start;flex:1}
.drawer-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.drawer-f .btn{flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;font-size:13px}
.kv span{color:var(--ink-3)}
.timeline{display:grid;gap:12px;border-left:2px solid var(--line);padding-left:14px;margin-left:6px}
.timeline div{position:relative;font-size:13px}
.timeline div:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.timeline small{display:block;color:var(--ink-3)}
.x-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
select.sel,input.sel{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;width:100%}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;width:460px;max-width:calc(100% - 32px);max-height:calc(100% - 60px);overflow:auto;background:#fff;border-radius:16px;z-index:72;transition:.2s;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;opacity:0;transition:.25s;z-index:90;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast svg{color:#7dd3fc}

@media (max-width:1240px){
  .kpis,.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .camp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1000px){
  #login{grid-template-columns:1fr}
  .login-art{padding:28px 22px}
  .login-art h1{font-size:28px;margin:22px 0 8px}
  .login-art .feat,.login-art .foot{display:none}
  .login-panel .lang{top:14px;right:14px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:30px;bottom:0;width:264px;z-index:75;transform:translateX(-100%);transition:transform .25s ease;height:auto}
  .side.show{transform:none}
  .menu-btn{display:grid}
  .grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}
  .search{display:none}
  .top .lang{margin-left:auto}
  .top{padding:10px 16px}
  .content{padding:16px 16px 40px}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .inbox .reader{display:none}
  .inbox.reading .threads{display:none}
  .inbox.reading .reader{display:flex}
  .threads{border-right:0;max-height:none}
  .back-btn{display:inline-flex;margin-bottom:10px}
}
@media (max-width:640px){
  .kpis,.kpis.k3,.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:13px}
  .kpi .val{font-size:21px}
  .camp-grid{grid-template-columns:minmax(0,1fr)}
  .kanban{grid-template-columns:repeat(5,82%)}
  .hide-sm{display:none}
  .top h1{font-size:16px}
  .top .avatar{display:none}
  .drawer{width:100%}
  .kv{grid-template-columns:100px 1fr}
  .ribbon{font-size:11px}
  .q-grid{grid-template-columns:minmax(0,1fr)}
  .svc-tiles{grid-template-columns:1fr 1fr}
  .hero-mock{grid-template-columns:1fr}
  .hero-mock img{display:none}
}
</style>
</head>
<body>

<div class="ribbon" data-i18n="ribbon"></div>

<!-- ===================== LOGIN ===================== -->

  const R=[1700,1850,1600,1950,1800,2050,1900,2200],C=[600,650,700,900,1050,1250,1400,1650];
  const W=600,H=220,p=34,max=4000,x=i=>p+i*(W-p*2)/(R.length-1),y=v=>H-p-(v/max)*(H-p*2);
  let bars='';R.forEach((v,i)=>{const bw=26,cx=x(i);bars+=`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" fill="#1d5fbf" rx="3" stroke="none"/><rect x="${cx-bw/2}" y="${y(v+C[i])}" width="${bw}" height="${y(v)-y(v+C[i])-2}" fill="#0d9488" rx="3" stroke="none"/>`;});
  let grid='';[0,1000,2000,3000,4000].forEach(v=>grid+=`<line x1="${p}" x2="${W-p+14}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f7"/><text x="${p-8}" y="${y(v)+4}" font-size="10" fill="#94a3b8" text-anchor="end" stroke="none">$${v/1000}k</text>`);
  let lab='';R.forEach((v,i)=>lab+=`<text x="${x(i)}" y="${H-12}" font-size="10" fill="#94a3b8" text-anchor="middle" stroke="none">${lang==='es'?'S':'W'}${i+1}</text>`);

let leadMode='board',leadSeg='all';

function drawLeads(){
  const L=leads.filter(l=>leadSeg==='all'||l.seg===leadSeg);
  $('#board').innerHTML=STAGES.map(s=>{const it=L.filter(l=>l.st===s);return `<div class="col"><div class="col-h">${t('stg_'+s)}<span>${it.length}</span></div>${it.map(l=>`<div class="lead-card" data-lead="${leads.indexOf(l)}"><b>${l.n}</b><div class="muted small">${t('svc_'+l.svc)} · ${t('fr_'+l.fr)}</div><div class="meta">${zoneTag(l.z)}<span style="font-weight:600;color:var(--ink)">${valTxt(l)}</span></div><div class="meta" style="margin-top:6px">${srcTag(l.src)}<span class="pill ${l.seg==='com'?'p-teal':'p-blue'}" style="font-size:10px">${t(l.seg==='com'?'commercial':'residential')}</span></div></div>`).join('')}</div>`;}).join('');
  $('#leadRows').innerHTML=L.map(l=>`<tr class="click" data-lead="${leads.indexOf(l)}"><td><div class="who"><div class="av" style="background:${colorFor(l.n)}">${initials(l.n)}</div><div>${l.n}<small>${t('z_'+l.z)}</small></div></div></td><td><span class="pill ${l.seg==='com'?'p-teal':'p-blue'}">${t(l.seg==='com'?'commercial':'residential')}</span></td><td>${t('svc_'+l.svc)}</td><td>${valTxt(l)}</td><td>${srcTag(l.src)}</td><td><span class="pill ${STAGE_PILL[l.st]}">${t('stg_'+l.st)}</span></td></tr>`).join('');
  $('#board').style.display=leadMode==='board'?'grid':'none';$('#list').style.display=leadMode==='list'?'block':'none';
  $('#newCount').textContent=leads.filter(l=>l.st==='new').length;
}

let weekOffset=0,crewF='all';
function drawCal(){
  const m=mondayOf(weekOffset),today=new Date();today.setHours(0,0,0,0);const end=new Date(m);end.setDate(m.getDate()+5);
  $('#calLabel').textContent=fmtD(m)+' – '+fmtD(end)+', '+end.getFullYear();
  $('#zoneLegend').innerHTML=['man','bk','qn','li'].map(z=>`<span><i style="background:${ZC[z]}"></i>${t('z_'+z)}</span>`).join('');
  const dz=d=>{const c={};events.filter(e=>e.d===d).forEach(e=>c[e.z]=(c[e.z]||0)+1);return Object.keys(c).sort((a,b)=>c[b]-c[a])[0];};
  let h='<div class="hd"></div>';
  t('days').forEach((d,i)=>{const dt=new Date(m);dt.setDate(m.getDate()+i);const z=weekOffset===0?dz(i):null;h+=`<div class="hd ${dt.getTime()===today.getTime()?'today':''}">${d}<b>${dt.getDate()}</b>${z?`<span class="zn" style="color:${ZC[z]}">${t('z_'+z)}</span>`:''}</div>`;});
  for(let hr=8;hr<=16;hr++){
    h+=`<div class="tm">${fmtH(hr)}</div>`;
    for(let d=0;d<6;d++){
      let evs='';
      if(weekOffset===0){
        const here=events.filter(e=>e.d===d&&e.h===hr&&(crewF==='all'||String(e.crew)===crewF));
        here.forEach(e=>{const both=crewF==='all'&&events.some(o=>o!==e&&o.d===d&&o.h<e.h+e.len&&o.h+o.len>e.h);const half=both?(e.crew===1?'left:4px;right:50%':'left:50%;right:4px'):'';
          evs+=`<div class="ev" style="top:3px;height:${e.len*56-6}px;border-color:${ZC[e.z]};background:${ZBG[e.z]};color:#0f172a;${half}" data-ev="${events.indexOf(e)}"><b>${t('svc_'+e.svc)}</b>${e.cl}<br><span class="crew">${fmtH(e.h)}–${fmtH(e.h+e.len)} · Crew ${e.crew}</span></div>`;});
      }else if((d*3+hr+weekOffset*5)%11===0&&(crewF==='all'||crewF==='1')){evs=`<div class="ev" style="top:3px;height:${2*56-6}px;border-color:${ZC.man};background:${ZBG.man}"><b>${t('svc_office')}</b>${t('fr_weekly')}</div>`;}
      h+=`<div class="cell" data-slot="${d}-${hr}">${evs}</div>`;
    }
  }
  $('#cal').innerHTML=h;
}
$('#calPrev').onclick=()=>{weekOffset--;drawCal();};$('#calNext').onclick=()=>{weekOffset++;drawCal();};$('#calToday').onclick=()=>{weekOffset=0;drawCal();};
segBind('#crewSeg',b=>{crewF=b.dataset.c;drawCal();});

   <div class="drawer-f">${j.st==='review'?`<button class="btn btn-ghost" id="jPh">${ICON.cam}${t('requestPhotos')}</button>`:''}<button class="btn btn-primary" id="jOk">${ICON.check}${t('approve')}</button></div>`);
  $('#jOk').onclick=()=>{j.st='passed';j.ph=Math.max(j.ph,6);j.ck=8;closeDrawer();drawQuality();drawDash();toast(t('toastApprove'));};
  if($('#jPh'))$('#jPh').onclick=()=>{closeDrawer();toast(t('toastPhotos'));};
});

/* =================== Payments =================== */
let payF='all';
function drawPayments(){
  const paid=invoices.filter(i=>i.due==='paid').reduce((s,i)=>s+i.amt,0),out=invoices.filter(i=>i.due!=='paid').reduce((s,i)=>s+i.amt+(i.fee||0),0);
  $('#payKpis').innerHTML=kpi(t('pk_collected'),money(paid+9310),'',ICON.cash,'#0d9488')+kpi(t('pk_out'),money(out),'',ICON.clock,'#dc2626')+kpi(t('pk_late'),'$75','',ICON.cash,'#d97706')+kpi(t('pk_tos'),'23/26','',ICON.pen,'#1d5fbf');
  const P={paid:'p-teal',due:'p-amber',late:'p-red'};
  $('#payRows').innerHTML=invoices.filter(i=>payF==='all'||i.due===payF).map(i=>{const idx=invoices.indexOf(i);const when=i.due==='late'?`${i.when} ${t('lateBy')}`:(i.when.startsWith('due')?t(i.when):i.when);
    return `<tr><td><b>${i.cl}</b></td><td>${t('svc_'+i.svc)}</td><td>${money(i.amt)}${i.fee?` <span class="pill p-red" style="font-size:10px">+$${i.fee}</span>`:''}</td><td class="muted">${when}</td><td><span class="pill ${P[i.due]}">${t('st_'+i.due)}</span></td><td>${i.due!=='paid'?`<button class="btn btn-ghost btn-sm" data-remind="${idx}">${t('remind')}</button>`:''}</td></tr>`;}).join('');
  $('#policies').innerHTML=[['pol1',ICON.clock,'#dc2626'],['pol2',ICON.x,'#d97706'],['pol3',ICON.pen,'#1d5fbf'],['pol4',ICON.repeat,'#0d9488']].map(([k,ic,c])=>`<div class="policy"><span class="ico-box" style="background:${c}1a;color:${c}">${ic}</span><div><b>${t(k+'h')}</b><div class="muted small">${t(k)}</div></div></div>`).join('');
}
segBind('#payFilter',b=>{payF=b.dataset.f;drawPayments();});
document.addEventListener('click',e=>{const r=e.target.closest('[data-remind]');if(!r)return;toast(t('toastRemind')+' '+invoices[+r.dataset.remind].cl);});

/* =================== Email =================== */
function drawEmail(){
  $('#emailKpis').innerHTML=kpi(t('ek_contacts'),'2,860','')+kpi(t('ek_open'),'52%','')+kpi(t('ek_reply'),'4.1%','')+kpi(t('ek_meet'),'7','');
  const card=(h,d,pill,pc,s)=>`<div class="card camp"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b>${h}</b><span class="pill ${pc}">${pill}</span></div><div class="muted small">${d}</div><div class="stats">${s.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>`;
  $('#seqs').innerHTML=card(t('seq1'),t('seq1d'),t('running'),'p-teal',[['1,420',t('sent')],['5.2%',t('replies')],['4',t('meetings')]])+card(t('seq2'),t('seq2d'),t('running'),'p-teal',[['1,310',t('sent')],['3.6%',t('replies')],['2',t('meetings')]])+card(t('seq3'),t('seq3d'),t('running'),'p-teal',[['690',t('sent')],['3.0%',t('replies')],['1',t('meetings')]]);
  $('#autos').innerHTML=card(t('au1'),t('au1d'),t('running'),'p-teal',[['64',t('contacts')],['61%',t('opens')],['9',t('bookings')]])+card(t('au2'),t('au2d'),t('running'),'p-teal',[['18',t('contacts')],['47%',t('opens')],['3',t('bookings')]])+card(t('au3'),t('au3d'),t('running'),'p-teal',[['58',t('sent')],['63%',t('opens')],['14',t('reviews')]]);
}
$('#newSeq').onclick=()=>toast(t('toastCamp'));

/* =================== Ads =================== */
const ads=[
 {p:'Google',n:'Search — Office cleaning Manhattan',s:150,l:5,b:2,v:'good'},
 {p:'Google',n:'Search — Commercial cleaning Brooklyn',s:100,l:3,b:1,v:'ok'},
 {p:'Meta',n:'Before/after reel — your footage',s:160,l:12,b:4,v:'good'},
 {p:'Meta',n:'Deep clean — Queens & Long Island',s:100,l:6,b:2,v:'good'},
 {p:'Meta',n:'Generic discount static',s:41,l:1,b:0,v:'bad'},
 {p:'TikTok',n:'Test — 30s office reset',s:50,l:2,b:0,v:'ok'}
];
let adP='all';
function drawAds(){
  const A=ads.filter(a=>adP==='all'||a.p===adP);const S=A.reduce((s,a)=>s+a.s,0),L=A.reduce((s,a)=>s+a.l,0),B=A.reduce((s,a)=>s+a.b,0);
  $('#adKpis').innerHTML=kpi(t('ak_spend'),money(S),'')+kpi(t('ak_leads'),L,'')+kpi(t('ak_cpl'),L?'$'+(S/L).toFixed(2):'—','')+kpi(t('ak_cpb'),B?'$'+(S/B).toFixed(2):'—','');
  const V={good:'p-teal',ok:'p-amber',bad:'p-red'};
  $('#adRows').innerHTML=A.map(a=>`<tr><td><b>${a.n}</b><div><span class="tag"><span class="dot" style="background:${SRC[a.p]}"></span>${a.p}</span></div></td><td>${money(a.s)}</td><td>${a.l}</td><td>$${(a.s/a.l).toFixed(2)}</td><td>${a.b}</td><td><span class="pill ${V[a.v]}">${t('v_'+a.v)}</span></td></tr>`).join('');
  $('#adRecs').innerHTML=[['rec1',ICON.up,'#0d9488'],['rec2',ICON.cam,'#1d5fbf'],['rec3',ICON.x,'#dc2626'],['rec4',ICON.cash,'#d97706']].map(([k,ic,c])=>`<div class="insight"><span class="ico-box" style="background:${c}1a;color:${c}">${ic}</span><div><b>${t(k+'h')}</b><div class="muted small">${t(k)}</div></div></div>`).join('');
}
segBind('#adPlat',b=>{adP=b.dataset.p;drawAds();});

/* =================== Website =================== */

   <div class="list-item"><span class="ico-box" style="background:#1d5fbf1a;color:#1d5fbf">${ICON.mail}</span><div style="min-width:0"><b style="overflow-wrap:anywhere">office@team.nicoscleaningservices.com</b><div class="muted small">PRO-DG · ${t('mb2')}</div></div></div>
   <div class="list-item"><span class="ico-box" style="background:#1d5fbf1a;color:#1d5fbf">${ICON.mail}</span><div style="min-width:0"><b style="overflow-wrap:anywhere">quotes@team.nicoscleaningservices.com</b><div class="muted small">PRO-DG · ${t('mb2')}</div></div></div>`;

function renderAll(){
  applyStatic();$('#title').textContent=t('v_'+curView);
  fillQuoteSelects();
  drawDash();drawLeads();drawQuote();drawQuoteRows();drawCalls();drawThreads();drawReader();drawCal();drawRecurring();drawQuality();drawPayments();drawEmail();drawAds();drawWebsite();
}
applyStatic();
if(store.sget('nicos_demo')==='1')showApp();
})();
</script>
